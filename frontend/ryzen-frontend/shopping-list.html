<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping list example</title>
    <style>
      li {
        margin-bottom: 10px;
      }

      li button {
        font-size: 12px;
        margin-left: 20px;
        color: #666;
      }
    </style>
  </head>
  <body>

    <h1>My shopping list</h1>

    <form>
      <label for="item">Enter a new item:</label>

      <input type="text" name="item" id="item">

      <button>Add item</button>
    </form>

    <ul>

    </ul>

    <script>

        const ulPara = document.querySelector('ul');
        const inputPara = document.querySelector('input');
        const buttonPara = document.querySelector('button');


        buttonPara.addEventListener('click', function(event){
            const inputItem = document.getElementById("item");
            event.preventDefault();
            const haha = inputItem.value;

            inputItem.value = "";

            const item = document.createElement("li");
            const span = document.createElement("span");
            const deleteButton = document.createElement("button");

            ulPara.append(item);
            item.append(span);
            item.append(deleteButton);

            span.textContent=haha;
            deleteButton.textContent="Delete";

            deleteButton.addEventListener("click", function(){
                item.remove();
            });

            inputPara.focus();
        });



   
    </script>
  </body>
</html>
